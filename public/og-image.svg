<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dbfcff"/>
      <stop offset="100%" stop-color="#00dbe9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="24" fill="url(#bg)"/>
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="none" stroke="#1e293b" stroke-width="2"/>

  <g transform="translate(160,160)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="32" y="44" font-family="sans-serif" font-size="36" fill="#dbfcff" text-anchor="middle" font-weight="bold">d</text>
  </g>

  <text x="250" y="205" font-family="sans-serif" font-size="56" fill="#dbfcff" font-weight="bold" letter-spacing="2">dEPR Insight</text>
  <text x="250" y="250" font-family="sans-serif" font-size="24" fill="#64748b" letter-spacing="6">EPR SIMULATION SUITE</text>

  <line x1="250" y1="278" x2="550" y2="278" stroke="url(#accent)" stroke-width="2" opacity="0.4"/>

  <text x="250" y="320" font-family="sans-serif" font-size="20" fill="#94a3b8">
    Simulation and interpretation of d-orbital EPR spectra
  </text>
  <text x="250" y="352" font-family="sans-serif" font-size="20" fill="#94a3b8">
    for transition metal complexes
  </text>

  <g transform="translate(160,430)">
    <rect x="0" y="0" width="180" height="44" rx="22" fill="#0d9488" opacity="0.15" stroke="#0d9488" stroke-width="1.5"/>
    <text x="90" y="28" font-family="sans-serif" font-size="16" fill="#5eead4" text-anchor="middle">g-factors</text>

    <rect x="200" y="0" width="180" height="44" rx="22" fill="#0d9488" opacity="0.15" stroke="#0d9488" stroke-width="1.5"/>
    <text x="290" y="28" font-family="sans-serif" font-size="16" fill="#5eead4" text-anchor="middle">hyperfine splitting</text>

    <rect x="400" y="0" width="220" height="44" rx="22" fill="#0d9488" opacity="0.15" stroke="#0d9488" stroke-width="1.5"/>
    <text x="510" y="28" font-family="sans-serif" font-size="16" fill="#5eead4" text-anchor="middle">powder spectra</text>

